name: cs2-single-server
services:
  server:
    image: cs2-single-server-local:legacy
    platform: linux/amd64
    build:
      context: ../..
      dockerfile: legacy/single-server/Dockerfile
    env_file: ../../private/single-server.env
    volumes:
      - game:/home/steam/
      - ../../data/single-server/custom_files:/home/custom_files/
    ports: ["27015:27015/udp", "27015:27015/tcp", "27020:27020/udp", "27020:27020/tcp"]
volumes:
  game:
