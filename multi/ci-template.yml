name: multi-instance checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m unittest discover -s multi -v
      - run: mkdir -p multi/private && for n in 1 2 3; do cp multi/server.env.example multi/private/server$n.env; done
      - run: docker compose -f multi/compose.yaml config --quiet
      - run: docker build -f multi/Dockerfile -t cs2-multi-local:latest .
      - run: python3 multi/docker_smoke.py
