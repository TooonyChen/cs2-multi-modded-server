name: Bug report
description: Report a fleet runtime or bundled mod issue
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Remove credentials, GSLTs, passwords, admin IDs and player data before sharing logs or configuration."
  - type: input
    id: environment
    attributes:
      label: Environment and image
      description: Linux version, Docker/Compose versions, image tag or digest, affected services.
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem and steps to reproduce
      description: Expected behavior, actual behavior, update policy, and affected game modes/plugins.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Sanitized logs
      description: Relevant updater/server logs and plugin versions when applicable.
      render: shell
