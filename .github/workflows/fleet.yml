name: Fleet checks and public image
on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: fleet-${{ github.ref }}
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Runtime and historical helper tests
        run: |
          python3 -m unittest discover -s multi -v
          python3 -m unittest discover -s multi/legacy-maintenance -v
      - name: Validate public deployment configuration
        run: |
          mkdir -p multi/private
          for n in 1 2 3; do cp multi/server.env.example multi/private/server$n.env; done
          docker compose -f multi/compose.yaml config --quiet
      - name: Build Linux amd64 runtime
        run: docker build --platform linux/amd64 -f multi/Dockerfile -t cs2-multi-local:latest .
      - name: Offline Docker coordination and isolation smoke
        run: python3 multi/docker_smoke.py
  publish:
    needs: validate
    if: >-
      github.repository == 'TooonyChen/cs2-multi-modded-server' &&
      github.event_name != 'pull_request' &&
      (github.ref == format('refs/heads/{0}', github.event.repository.default_branch) ||
       (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require release commit to belong to default branch
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: git merge-base --is-ancestor HEAD "origin/$DEFAULT_BRANCH"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/tooonychen/cs2-multi-modded-server
          flavor: latest=false
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=long
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          labels: |
            org.opencontainers.image.source=https://github.com/TooonyChen/cs2-multi-modded-server
            org.opencontainers.image.licenses=LGPL-3.0-only
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        id: publish
        with:
          context: .
          file: multi/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Record published digest
        env:
          IMAGE_DIGEST: ${{ steps.publish.outputs.digest }}
        run: printf 'Published ghcr.io/tooonychen/cs2-multi-modded-server@%s\n' "$IMAGE_DIGEST" >> "$GITHUB_STEP_SUMMARY"
